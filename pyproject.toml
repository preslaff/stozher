[project]
name = "stozher"
version = "0.0.0"
description = "STOZHER workspace root"
requires-python = ">=3.12"
dependencies = ["stozher-core"]

[tool.uv.sources]
stozher-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/stozher_core"]

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/vectors/make_vectors.py" = ["E501"]
