[project]
name = "stozher"
version = "0.0.0"
description = "STOZHER workspace root"
requires-python = ">=3.12"
dependencies = ["stozher-core", "stozher-api", "stozher-worker", "stozher-simulator"]

[tool.uv.sources]
stozher-core = { workspace = true }
stozher-api = { workspace = true }
stozher-worker = { workspace = true }
stozher-simulator = { workspace = true }

[tool.uv.workspace]
members = ["packages/stozher_core", "services/api", "services/worker", "services/simulator"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "hypothesis", "httpx", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # formatter owns line length; FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/vectors/make_vectors.py" = ["E501"]

[[tool.mypy.overrides]]
module = ["h3", "shapely", "shapely.*", "sklearn", "sklearn.*", "pyproj", "yaml"]
ignore_missing_imports = true
