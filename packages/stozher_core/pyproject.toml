[project]
name = "stozher-core"
version = "0.0.0"
description = "Codec, crypto, schemas and trust model shared by every STOZHER service"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "cryptography"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stozher_core"]

[tool.mypy]
strict = true
