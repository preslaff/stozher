[project]
name = "stozher-assistant"
version = "0.0.0"
description = "Optional text assistant: answers questions about the situation through the STOZHER API, with sources"
requires-python = ">=3.12"
dependencies = ["httpx", "fastapi", "uvicorn", "pydantic", "pydantic-settings"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]
