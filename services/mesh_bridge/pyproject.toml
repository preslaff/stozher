[project]
name = "stozher-mesh-bridge"
version = "0.0.0"
description = "Bridge between a Meshtastic gateway radio and the STOZHER API"
requires-python = ">=3.12"
# The Meshtastic library is GPL-3.0, so this package is GPL-3.0-or-later and talks to the rest of
# the platform only over HTTP (the public /v1 API). Nothing else imports it.
license = "GPL-3.0-or-later"
dependencies = ["httpx"]

[project.optional-dependencies]
radio = ["meshtastic>=2.5"]  # needed only to drive a real radio; tests use a fake one

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesh_bridge"]
