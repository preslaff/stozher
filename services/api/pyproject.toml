[project]
name = "stozher-api"
version = "0.0.0"
description = "STOZHER public /v1 API"
requires-python = ">=3.12"
dependencies = [
    "stozher-core",
    "fastapi>=0.115",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "geoalchemy2",
    "alembic",
    "pydantic-settings",
    "cryptography",
]

[dependency-groups]
dev = ["pytest-asyncio", "httpx"]

[tool.uv.sources]
stozher-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stozher_api"]
