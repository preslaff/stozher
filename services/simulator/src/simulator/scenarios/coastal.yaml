    start: 2000
    end: 3200
    eirp_dbm: 27
    kind: chirp
    track:   # driving north along the coast road
      - [2000, 43.2300, 27.9600]
      - [2600, 43.2700, 28.0250]
      - [3200, 43.3050, 28.0750]
spoofers:
  - {id: spoof-harbour, start: 2400, end: 3000, lat: 43.2100, lon: 27.9000, radius_m: 3500,
     push_m: 450, push_bearing_deg: 60, drag_off_s: 120}
benign:
