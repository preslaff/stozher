name: coastal
description: >
  One hour on the Varna coast. A static jammer near the port, a vehicle-borne jammer driving
  north along the coast road, a spoofing zone near the western harbour, a benign
  scintillation episode, and forged and replayed records that must be rejected.
seed: 7
duration_s: 3600
nodes:
