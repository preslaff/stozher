  - {name: inland-1, lat: 43.3400, lon: 27.7800, kind: expert, link: kineis}
  - {name: inland-2, lat: 43.1000, lon: 27.7500, kind: expert, link: kineis}
jammers:
  - {id: jam-port, start: 600, end: 1800, lat: 43.1880, lon: 27.9100, eirp_dbm: 30, kind: wideband}
