  - {name: city-1, lat: 43.2141, lon: 27.9147, kind: expert, link: kineis}
  - {name: city-2, lat: 43.2050, lon: 27.9400, kind: tbeam, link: mesh}
  - {name: city-3, lat: 43.2250, lon: 27.9300, kind: phone, link: direct}
  - {name: city-4, lat: 43.1980, lon: 27.8900, kind: tbeam, link: mesh}
  # airport
  - {name: airport-1, lat: 43.2320, lon: 27.8250, kind: expert, link: kineis, extended: true}
