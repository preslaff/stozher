  - {name: port-1, lat: 43.1895, lon: 27.9035, kind: expert, link: kineis, extended: true}
  - {name: port-2, lat: 43.1905, lon: 27.9120, kind: tbeam, link: mesh}
  - {name: port-3, lat: 43.1840, lon: 27.9060, kind: tbeam, link: mesh}
  - {name: port-4, lat: 43.1870, lon: 27.9190, kind: expert, link: kineis}
