[project]
name = "stozher-worker"
version = "0.0.0"
description = "STOZHER analytics worker: hotspots, source localization, trust grid"
requires-python = ">=3.12"
dependencies = [
    "stozher-core",
    "stozher-api",  # shares the database models and migrations
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "geoalchemy2",
    "h3>=4",
    "shapely>=2",
    "pyproj",
    "scikit-learn",
    "numpy",
]

[tool.uv.sources]
stozher-core = { workspace = true }
stozher-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stozher_worker"]
