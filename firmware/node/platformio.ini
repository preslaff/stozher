; STOZHER witness node firmware (docs/packet.md, CLAUDE.md section 7).
; `pio test -e native` runs the codec against the golden vectors on the host (no hardware needed).
; The node board is the Seeed XIAO ESP32-S3 (Arduino framework).

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -Werror

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -fsanitize=address,undefined -fno-sanitize-recover=undefined
lib_compat_mode = off

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<leonardo_main.cpp>

; Second option for the node: Arduino Leonardo (ATmega32U4, 2.5 KB RAM). A size probe for now.
[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
monitor_speed = 115200
build_flags = ${env.build_flags} -Wno-error=unused-parameter -DSTZ_TX_QUEUE=4 -DSTZ_NO_MESH -DSTZ_NO_PER_SV  ; the Arduino AVR core trips the first
build_src_filter = -<*> +<leonardo_main.cpp>
