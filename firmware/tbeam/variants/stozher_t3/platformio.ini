; STOZHER: a LilyGO T3 (T-LoRa V2.1-1.6) as a store-and-forward gateway (no GNSS, so no witness module): it keeps every
; witness record it hears in flash until a bridge has it (docs/mesh.md). Uses Meshtastic's own tlora-v2-1-1_6 board files;
; copied into the checkout by apply.sh.
[env:tlora-v2-1-1_6-stozher-gw]
extends = env:tlora-v2-1-1_6
board_level = extra
build_flags =
  ${env:tlora-v2-1-1_6.build_flags}
  -D STOZHER_STORE=1
