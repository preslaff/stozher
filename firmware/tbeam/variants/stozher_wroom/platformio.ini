; STOZHER: an ESP32-WROOM-32 DevKit with an RFM95W (SX1276) and a u-blox GNSS (6, 7, 8, 9 or 10), running the STOZHER
; witness module. Adapted from Meshtastic's variants/esp32/diy/v1 (GPL-3.0); copied into the checkout by apply.sh.
[env:diy-wroom-stozher]
custom_meshtastic_hw_model = 39
custom_meshtastic_hw_model_slug = DIY_V1
custom_meshtastic_architecture = esp32
custom_meshtastic_display_name = DIY V1 (STOZHER)
extends = esp32_base
board_level = extra
board = esp32doit-devkit-v1
build_flags =
  ${esp32_base.build_flags}
  -D DIY_V1
  -D STOZHER_TAP=1
  -I variants/esp32/diy/stozher_wroom
